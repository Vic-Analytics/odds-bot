# This file tells GitHub Actions WHEN to run the bot and HOW.
# GitHub reads every .yml file in .github/workflows/ automatically.
#
# How the daily schedule works (and why it is built this way):
#   GitHub starts scheduled runs LATE, often by 30-50 minutes and sometimes
#   by hours, and its cron times are in UTC (no daylight saving). A single
#   "run at exactly 8 AM" job therefore misses days. Instead:
#     1. The job starts every hour, at 15 minutes past (07:15-22:15 UTC covers
#        2:15 AM-5 PM Central in both summer and winter). GitHub is busiest at
#        the top of the hour, and it recommends avoiding :00, so we use :15.
#        (GitHub runs a workflow's timer at most once an hour however many
#        slots it has, so one slot an hour is all there is to use. On Nov 12-13
#        2026 it started almost none at all, so the window runs until 5 PM:
#        a late brief beats no brief.)
#     2. gate.py checks if it is between 7 AM and 5 PM Central. A run that
#        starts EARLIER (after 1:30 AM Central) is not turned away: it waits
#        in the job until 7:00 AM and then sends. GitHub starts only about
#        three scheduled runs a day now, at times it picks, and for the recap
#        some of those come before dawn, so the cron also covers the night.
#     3. The first run inside that window sends the digest and saves a small
#        "sent today" marker. Later runs find the marker and do nothing.
#     4. If a run is late or fails, the next hour's run covers it.

name: Daily odds digest

on:
  schedule:
    - cron: "15 7-22 * * *"
  # Adds a "Run workflow" button in the Actions tab, so you can test by hand, or
  # send the brief yourself when GitHub's timer did not. A manual run always sends
  # right away and ignores the daily marker, but it leaves the marker behind, so a
  # late timer run does not send the brief a second time.
  workflow_dispatch:

# The bot only needs to read the code, nothing more.
permissions:
  contents: read

# Never run two copies at once, so two overlapping runs can't both send.
# A waiting run starts after the first finishes and then sees its marker.
# (One consequence: a run that started early and is waiting for 7:00 AM holds the line,
# so a manual "Run workflow" pressed during that wait starts after it and ignores the
# marker, which means you would get the brief twice. Before 7 AM there is no brief yet,
# so the simple answer is not to press the button then.)
concurrency:
  group: daily-odds-digest
  cancel-in-progress: false

jobs:
  send-digest:
    runs-on: ubuntu-latest   # a temporary Linux machine in GitHub's cloud
    # Safety net. A run that starts early waits up to 330 minutes for the window to open
    # (see the wait step), and a job may run 6 hours at most. The send step has its own
    # 10-minute limit, so a hang while sending is still cut off quickly.
    timeout-minutes: 350

    steps:
      # 1. Download your repository's code onto the temporary machine.
      - uses: actions/checkout@v4

      # 2. Is it time to send? (gate.py uses only Python's standard library,
      #    so this takes a second.) Scheduled runs outside 7 AM-5 PM Central
      #    stop here. Manual runs always continue.
      - name: Is it time to send?
        id: gate
        run: python3 gate.py "${{ github.event_name }}"

      # 3. Was today's digest already sent by an earlier run? The marker is
      #    stored in GitHub's cache under a key containing today's date.
      - name: Was today's digest already sent?
        id: already
        if: steps.gate.outputs.go == 'true' && github.event_name == 'schedule'
        uses: actions/cache/restore@v4
        with:
          path: sent.marker
          key: digest-sent-${{ steps.gate.outputs.today }}

      # 4. Install Python and the libraries (only when we are going to send).
      - uses: actions/setup-python@v5
        if: steps.gate.outputs.go == 'true' && steps.already.outputs.cache-hit != 'true'
        with:
          python-version: "3.12"
          cache: pip

      - name: Install requirements
        if: steps.gate.outputs.go == 'true' && steps.already.outputs.cache-hit != 'true'
        run: pip install -r requirements.txt

      # 4b. Early start: wait here until the send window opens at 7:00 AM Central. gate.py
      #     says how long (0 for runs inside the window and for manual runs, which never
      #     wait). Skipped when an earlier run already sent today's digest.
      - name: Wait for the send window to open
        if: steps.gate.outputs.go == 'true' && steps.already.outputs.cache-hit != 'true' && steps.gate.outputs.wait != '0'
        timeout-minutes: 340
        env:
          WAIT_SECONDS: ${{ steps.gate.outputs.wait }}
        run: |
          echo "Waiting $WAIT_SECONDS seconds for the send window to open"
          sleep "$WAIT_SECONDS"

      # 5. Run the bot. The secrets you stored on GitHub become environment
      #    variables with the same names as in your .env file, which is exactly
      #    where our code looks for them. main.py also writes sent.marker once
      #    the digest is delivered (manual runs too, so a late timer run does not
      #    send it again).
      - name: Send the digest
        id: send
        if: steps.gate.outputs.go == 'true' && steps.already.outputs.cache-hit != 'true'
        timeout-minutes: 10
        run: python main.py --marker-file sent.marker
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}

      # 5b. The missed-digest alarm (see "Missed-digest alarm" in the README).
      #     Right after the digest is delivered, ping healthchecks.io. If that
      #     service does not hear from us by the deadline you set, IT sends you
      #     an alert, from outside GitHub, so it works even when GitHub is down
      #     or this schedule is switched off.
      #     The ping happens after the digest, so it cannot delay or stop it,
      #     and it cannot fail the run: a missing secret, a slow service or an
      #     error is ignored (3 tries of at most 10 seconds; 1 minute at most).
      #     "Delivered" means the marker file exists (scheduled runs) or a manual
      #     run's digest step succeeded. If every sport failed there is no
      #     marker, so there is no ping, and the next hourly run tries again.
      - name: Tell healthchecks.io the digest was delivered
        if: always() && steps.gate.outputs.go == 'true' && steps.already.outputs.cache-hit != 'true' && (hashFiles('sent.marker') != '' || (github.event_name == 'workflow_dispatch' && steps.send.outcome == 'success'))
        continue-on-error: true
        timeout-minutes: 1
        env:
          HEALTHCHECK_PING_URL: ${{ secrets.HEALTHCHECK_PING_URL }}
        run: python scripts/ping_healthcheck.py

      # 6. Keep the odds the bot just pulled. The runner is wiped after this job,
      #    so the raw files from data/raw are copied into a separate PRIVATE
      #    repo (odds-history-data) with a deploy key that can write to that
      #    one repo only. This runs AFTER the digest is sent, so a problem
      #    saving data can never stop or delay your message; it shows up as a
      #    red run (and a GitHub email) instead. It also runs for manual runs,
      #    since those spend real credits too.
      - name: Save the raw odds to the private data repo
        if: always() && steps.gate.outputs.go == 'true' && steps.already.outputs.cache-hit != 'true' && hashFiles('data/raw/**/*.json') != ''
        env:
          DEPLOY_KEY: ${{ secrets.ODDS_DATA_DEPLOY_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/data_deploy_key
          chmod 600 ~/.ssh/data_deploy_key
          python scripts/publish_data.py --publish data/raw=raw --ssh-key ~/.ssh/data_deploy_key

      # 7. Remember that today's digest was sent. This runs even if main.py
      #    exited with an error code (for example one sport failed but the
      #    others were delivered). It only saves when the marker file exists,
      #    so a run where everything failed leaves no marker and the next
      #    hour's run tries again.
      - name: Remember that today's digest was sent
        if: always() && steps.gate.outputs.go == 'true' && steps.already.outputs.cache-hit != 'true' && hashFiles('sent.marker') != ''
        uses: actions/cache/save@v4
        with:
          path: sent.marker
          key: digest-sent-${{ steps.gate.outputs.today }}
