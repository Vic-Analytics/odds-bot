# Sends the results recap to Telegram right after the LAST game of the day has finished.
#
# How it works (and why it is built this way):
#   Games run from the afternoon until after midnight Central, and nothing tells us
#   "the last game just ended". The first scheduled run after 6 PM Central therefore
#   stays alive and keeps checking the scores every 3 minutes until the last game is
#   final. Each run does this:
#     1. recap_gate.py: is it inside the window (6 PM to 10 AM Central), and which day is
#        this recap for? (A recap day runs from 10 AM to 10 AM, so a game that ends at
#        12:30 AM still belongs to the day it started on.)
#     2. Was that day's recap already sent? A small marker in GitHub's cache says so.
#     3. recap.py downloads the day's odds from the private data repo, asks the FREE
#        score sources (ESPN, MLB, NHL) for the finals, and:
#          - if any game is still going: waits 3 minutes and looks again;
#          - if everything is final: sends the recap and writes the marker.
#        A game with no final score 5 hours after its start (postponed, or not
#        reported) no longer holds the recap up.
#
#   Why it does not just run every 20 minutes: GitHub's timer is best effort. It
#   actually started this about once an hour, and on Nov 11 it started nothing for nine
#   hours, so a recap that was a few minutes away arrived at 9 AM. A run that is already
#   alive does not need the timer.
#
#   A job can live at most 6 hours, so the work is split in two parts that run one after
#   the other in the same run (part 2 starts the moment part 1 ends, with no timer in
#   between). Together they cover 6 PM to about 5:30 AM. If part 1 already sent the
#   recap, part 2 sees the marker and stops after a few seconds. The timer still starts
#   a run every 30 minutes: it is the safety net that sends last night's recap in the
#   morning if a night went wrong. Extra runs wait in line (see "concurrency") and see
#   the marker, so nothing is sent twice.
#
#   It costs no Odds API credits. Staying alive for hours uses about 5 hours of Actions
#   time a night, which is free while this repository is public; for a private repository
#   (2,000 free minutes a month) it would not fit.
#
# The secrets are split between steps: the deploy key only downloads the data, and the
# Telegram token only sends the message. Neither step can see the other's secret.

name: Results recap

on:
  schedule:
    # Every 30 minutes (:07 and :37: GitHub is busiest at :00) from 23:00 to 15:59 UTC.
    # That covers 6 PM to 10 AM Central in summer and winter; recap_gate.py makes the
    # exact decision, daylight saving included.
    - cron: "7,37 23,0-15 * * *"
  # Adds a "Run workflow" button. A manual run sends right away whatever is final
  # (even if some games are still going) and ignores the "already sent" marker.
  workflow_dispatch:
    inputs:
      date:
        description: "Day to recap, YYYY-MM-DD (leave empty for the current recap day)"
        required: false
        default: ""

permissions:
  contents: read

# Never run two timer-started copies at once, so two runs can't both send the same recap.
# A run that starts while another is going waits in line (only the newest waiting run is
# kept, the older ones are cancelled: that is normal). A manual run gets a group of its
# own, so pressing "Run workflow" never waits behind a long night of checking.
concurrency:
  group: ${{ github.event_name == 'schedule' && 'results-recap' || format('results-recap-manual-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  recap:
    name: recap (part ${{ matrix.part }})
    runs-on: ubuntu-latest
    # A job may run 6 hours at most. The check below stops after 5.5 hours (--keep-waiting 330)
    # and this limit is the backstop.
    timeout-minutes: 350
    strategy:
      fail-fast: false          # if part 1 breaks, part 2 still tries
      max-parallel: 1           # one after the other, never together
      matrix:
        part: ${{ fromJSON(github.event_name == 'schedule' && '[1, 2]' || '[1]') }}      # a manual run is one part

    steps:
      - uses: actions/checkout@v4

      # Inside the window? Which day? (Standard library only, so this takes a second.)
      - name: Is it time to look?
        id: gate
        env:
          EVENT: ${{ github.event_name }}
          REQUESTED_DAY: ${{ inputs.date }}
        run: python3 recap_gate.py "$EVENT" "$REQUESTED_DAY"

      # Was this day's recap already sent? Scheduled runs only.
      - name: Was today's recap already sent?
        id: already
        if: steps.gate.outputs.go == 'true' && github.event_name == 'schedule'
        uses: actions/cache/restore@v4
        with:
          path: recap.marker
          key: recap-sent-${{ steps.gate.outputs.day }}

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.go == 'true' && steps.already.outputs.cache-hit != 'true'
        with:
          python-version: "3.12"
          cache: pip

      - name: Install requirements
        if: steps.gate.outputs.go == 'true' && steps.already.outputs.cache-hit != 'true'
        run: pip install -r requirements.txt

      # Download the odds the morning digests saved. Only the deploy key is used here,
      # and it is deleted right after.
      - name: Download the odds from the private data repo
        if: steps.gate.outputs.go == 'true' && steps.already.outputs.cache-hit != 'true'
        env:
          DEPLOY_KEY: ${{ secrets.ODDS_DATA_DEPLOY_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/data_deploy_key
          chmod 600 ~/.ssh/data_deploy_key
          python scripts/publish_data.py --clone data-repo --ssh-key ~/.ssh/data_deploy_key
          rm -f ~/.ssh/data_deploy_key

      # Check the scores and, if the day is finished, send the recap. Only the Telegram
      # secrets are used here. A scheduled run keeps checking every 3 minutes for up to
      # 5.5 hours while games are going (--keep-waiting 330), then writes recap.marker once
      # the day needs no more checking. A manual run (--no-wait) sends what is final now.
      - name: Send the recap if the last game has finished
        if: steps.gate.outputs.go == 'true' && steps.already.outputs.cache-hit != 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RECAP_DAY: ${{ steps.gate.outputs.day }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = "schedule" ]; then
            python recap.py --data-dir data-repo --date "$RECAP_DAY" --marker-file recap.marker --keep-waiting 330
          else
            python recap.py --data-dir data-repo --date "$RECAP_DAY" --no-wait
          fi

      # Remember that this day's recap is done. Only when the marker file exists, so a
      # part that is still waiting (or failed) leaves nothing and the next part tries again.
      - name: Remember that this day's recap is done
        if: github.event_name == 'schedule' && steps.gate.outputs.go == 'true' && steps.already.outputs.cache-hit != 'true' && hashFiles('recap.marker') != ''
        uses: actions/cache/save@v4
        with:
          path: recap.marker
          key: recap-sent-${{ steps.gate.outputs.day }}
